name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Resolve the base branch
        if: github.event_name == 'pull_request'
        run: echo "LINT_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
      - name: Lint
        env:
          CLAUDE_BIN: npx -y @anthropic-ai/claude-code@2.1.306
        run: scripts/lint.sh
